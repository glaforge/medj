<!doctype html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="MedJ" />
    <meta name="apple-mobile-web-app-title" content="MedJ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="MedJ — L'application ultime de répétition espacée (Méthode des J) avec synchronisation Google Calendar et IA Gemini pour réussir sa 1ère année de médecine (PASS/LAS)." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>MedJ</title>
  </head>
  <body class="h-full antialiased font-sans selection:bg-sky-500 selection:text-white bg-slate-950 text-slate-100">
    <div id="root" class="h-full">
      <div style="min-height: 100vh; background-color: #030712; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(135deg, #0284c7, #14b8a6, #6366f1); animation: medj-spin 1.5s linear infinite;"></div>
          <div style="position: absolute; inset: 2.5px; border-radius: 14px; background: #030712; display: flex; align-items: center; justify-content: center;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M2 12h20"/>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: -0.025em; margin-bottom: 4px;">MedJ</div>
        <div style="font-size: 12px; color: #94a3b8; font-weight: 500;">Chargement de l'application...</div>
        <style>
          @keyframes medj-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
