plugins {
    id("groovy")
    id("io.micronaut.application") version "4.4.4"
    id("io.micronaut.aot") version "4.4.4"
    id("com.github.node-gradle.node") version "7.0.2"
}

version = "0.1.0"
group = "fr.medj"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    
    implementation("io.micronaut:micronaut-http-server-netty")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut:micronaut-http-client")
    
    // Google Gen AI SDK & LangChain4j
    implementation("com.google.genai:google-genai:1.57.0")
    implementation("dev.langchain4j:langchain4j:1.18.0")
    implementation("dev.langchain4j:langchain4j-google-ai-gemini:1.18.0")
    implementation("dev.langchain4j:langchain4j-google-genai:1.19.0-beta29")
    
    // Google Cloud Firestore & Storage
    implementation("com.google.cloud:google-cloud-firestore:3.27.0")
    implementation("com.google.cloud:google-cloud-storage:2.43.0")
    
    // Google Calendar & Auth
    implementation("com.google.apis:google-api-services-calendar:v3-rev20220715-2.0.0")
    implementation("com.google.api-client:google-api-client:2.7.0")
    implementation("com.google.oauth-client:google-oauth-client-jetty:1.36.0")
    
    // Security & JWT
    implementation("io.micronaut.security:micronaut-security-jwt")
    implementation("io.micronaut.security:micronaut-security-oauth2")

    // PDF processing for course documents
    implementation("org.apache.pdfbox:pdfbox:3.0.4")
    
    // Logging & Config
    runtimeOnly("org.yaml:snakeyaml")
    runtimeOnly("ch.qos.logback:logback-classic")
    
    // Testing
    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.mockito:mockito-core:5.14.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
}

application {
    mainClass.set("fr.medj.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}

graalvmNative.toolchainDetection = false

micronaut {
    version("5.1.0")
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("fr.medj.*")
    }
    aot {
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
    }
}

node {
    version = "22.14.0"
    npmVersion = "10.9.2"
    download = true
    nodeProjectDir = file("${projectDir}/frontend")
}

tasks.register("buildFrontend", com.github.gradle.node.npm.task.NpmTask) {
    args = ["run", "build"]
    workingDir = file("${projectDir}/frontend")
    inputs.dir("${projectDir}/frontend/src")
    inputs.dir("${projectDir}/frontend/public")
    inputs.file("${projectDir}/frontend/package.json")
    inputs.file("${projectDir}/frontend/vite.config.ts")
    inputs.file("${projectDir}/frontend/index.html")
    outputs.dir("${projectDir}/frontend/dist")
    dependsOn("npmInstall")
}

tasks.named("processResources") {
    dependsOn("buildFrontend")
    from("${projectDir}/frontend/dist") {
        into("public")
    }
}
