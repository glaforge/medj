micronaut:
  application:
    name: medj
  router:
    static-resources:
      default:
        paths:
          - classpath:public
        mapping: /**
  security:
    enabled: true
    intercept-url-map:
      - pattern: /**
        access:
          - isAnonymous()
  server:
    port: ${PORT:8080}
    host: 0.0.0.0
    multipart:
      enabled: true
      max-file-size: 50MB
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - "http://localhost:5173"
            - "http://localhost:8080"
            - "https://medj-505807.web.app"
            - "https://medj-505807.firebaseapp.com"
            - "https://medj.web.app"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "*"

medj:
  seed-sample-data: ${MEDJ_SEED_SAMPLE_DATA:false}
  security:
    enabled: ${MEDJ_SECURITY_ENABLED:true}
    allowed-emails: ${MEDJ_ALLOWED_EMAILS:glaforge@gmail.com,marionlaforge4@gmail.com}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.7-flash}
    image-model: ${GEMINI_IMAGE_MODEL:gemini-3-pro-image}
  google:
    calendar:
      calendar-name: "MedJ - Révisions PASS"
      time-zone: "Europe/Paris"
    cloud:
      project-id: ${GCP_PROJECT_ID:medj-505807}
      firestore-collection-prefix: ${FIRESTORE_PREFIX:medj_}
      storage-bucket: ${GCS_BUCKET:medj-505807-assets}
  scheduling:
    default-intervals: [0, 1, 3, 7, 14, 30, 60]
    daily-overload-threshold: 6

jackson:
  serialization:
    write-dates-as-timestamps: false
